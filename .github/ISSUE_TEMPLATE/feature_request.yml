name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the situation rather than the solution. It is easier to
        design something good from a problem than from a spec.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today
