<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Images come from the library over zb://; nothing else may load or
         connect. Saved pages can carry hostile markup, so this is not
         theoretical once the extension is in use. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' zb: data: blob:; media-src 'self' zb: blob:; font-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Bowerbird</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
