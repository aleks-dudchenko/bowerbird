<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Bowerbird — options</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; margin: 24px; max-width: 440px; }
      h1 { font-size: 15px; margin: 0 0 6px; }
      p { color: #555; line-height: 1.55; }
      ol { color: #555; line-height: 1.7; padding-left: 20px; }
      button { padding: 8px 16px; font: inherit; cursor: pointer; }
      .primary { background: #111; color: #fff; border: none; border-radius: 6px; }
      .status { margin-top: 12px; min-height: 18px; }
      .ok { color: #187d3c; }
      .err { color: #b42318; }
      details { margin-top: 22px; color: #666; }
      input { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Connect to Bowerbird</h1>
    <ol>
      <li>Open Bowerbird and go to <b>Settings</b>.</li>
      <li>Click <b>Pair extension</b>.</li>
      <li>Come back here and press Connect within two minutes.</li>
    </ol>

    <button id="pair" class="primary">Connect</button>
    <div id="status" class="status"></div>

    <details>
      <summary>Paste a token instead</summary>
      <p>
        Only needed if pairing cannot reach the app. The token is in Bowerbird
        under Settings → Reveal.
      </p>
      <input id="token" type="password" placeholder="Paste the token" autocomplete="off" />
      <button id="save">Save token</button>
    </details>
  </body>
  <script src="options.js"></script>
</html>
