<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Zbirka — options</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; margin: 24px; max-width: 420px; }
      h1 { font-size: 15px; margin: 0 0 6px; }
      p { color: #555; line-height: 1.5; }
      input { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
      button { margin-top: 10px; padding: 7px 14px; font: inherit; }
      .ok { color: #187d3c; }
    </style>
  </head>
  <body>
    <h1>Connect to Zbirka</h1>
    <p>
      Open Zbirka, go to Settings, and copy the connection token. It stays on
      your machine — nothing is sent anywhere except to the app on
      <code>127.0.0.1</code>.
    </p>
    <input id="token" type="password" placeholder="Paste the token" autocomplete="off" />
    <button id="save">Save</button>
    <span id="status" class="ok"></span>
    <script src="options.js"></script>
  </body>
</html>
